<!--Con grid andiamo a disporre la griglia e con grid-col-12 quando è lg vuol dire che si dispone la griglia in 12 colonne-->
<footer class="bg-zinc-900 border-t border-zinc-800">
    <div class="container mx-auto py-12 px-10">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">

            <div class="col-span-2">
                <a class="relative inline-block" href="#">
                    <fa-icon class="text-3xl text-zinc-400 hover:text-zinc-100" [icon]="faBall"></fa-icon>
                </a>
                <p class="mt-4 text-zinc-400">
                    Il miglior sito di Fantacalcio
                </p>
            </div>
            <div class="mt-4 col-span-1">
                <div class="mt-4 text-zinc-100">
                    Manuale Utente
                </div>
            </div>
            <div class="mt-4 col-span-1">
                <div class="mt-4 text-zinc-100">
                    Termini e condizioni
                </div>
            </div>

        </div>
    </div>

    <div class="container mx-auto">
        <div class="grid grid-cols-1">
            <div class="text-zinc-100 p-5 border-t border-zinc-800">
                @2026 Fantacalcio
            </div>

        </div>
    </div>
</footer>
