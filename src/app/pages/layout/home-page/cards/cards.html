<div class="min-h-screen bg-indigo-500/10 px-4 py-10">
    <div class="mx-auto grid max-w-4xl grid-cols-2 gap-4">
        @for (card of cards; track card.route) {
        <a [routerLink]="card.route" class="group flex h-full flex-col rounded-lg overflow-hidden
                    bg-zinc-800 border-zinc-700
                    border hover:border-indigo-500/50 transition-all duration-300
                    hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10">
            <!-- Contenitore immagine a rapporto fisso: garantisce altezza identica tra tutte le card -->
            <div class="relative aspect-video shrink-0 overflow-hidden">
                <img [src]="card.imgUrl" [alt]="card.title"
                    class="h-full w-full object-contain bg-white" />
            </div>

            <div class="flex flex-1 flex-col gap-1 p-4">
                <h3 class="text-base font-bold text-white">{{ card.title }}</h3>
                <p class="text-sm text-slate-300">{{ card.subTitle }}</p>
            </div>
        </a>
        }
    </div>
</div>
